backend:
  name: github
  repo: manas96/manas96.github.io
  branch: master
  
# Enable local backend for testing
local_backend: true

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Authors", name: "authors", widget: "list", required: false}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Slug", name: "slug", widget: "string", required: false}
      - {label: "Comments Enabled", name: "comments", widget: "boolean", default: true}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "pages"
    label: "Pages"
    folder: "content/page"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Menu", name: "menu", widget: "list", required: false}
      - {label: "Weight", name: "weight", widget: "number", required: false}
      - {label: "Comments Enabled", name: "comments", widget: "boolean", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
